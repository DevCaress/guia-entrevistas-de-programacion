name: Report a bug
description: Help us reproduce and fix a problem.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report this problem.
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL
      description: Include the page URL, if applicable.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and version, if applicable.
